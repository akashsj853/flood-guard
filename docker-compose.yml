# FloodGuard AI — local deployment
#
# Starts the FastAPI backend and the Nginx-served React frontend.
# The frontend proxies /api to the backend. No API keys are required
# (Open-Meteo is the default weather provider).
#
# Usage:
#   docker compose up --build
#   -> frontend:  http://localhost:5173  (or http://localhost:80 in prod profile)
#   -> backend:   http://localhost:8000  (docs at /docs)
#
# Use the "dev" profile to run the Vite dev server instead of the static build:
#   docker compose --profile dev up --build

services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./floodguard.db}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-openmeteo}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional Vite dev server (hot reload). Run with --profile dev.
  frontend-dev:
    build:
      context: ./frontend
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5174:5173"
    profiles: ["dev"]
    depends_on:
      - backend
